name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'app/**'

permissions:
  contents: read
  id-token: write  # required for GitHub OIDC -> AWS role assumption (no static keys)

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: insurance-claim-inference

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/insurance-claim-api:latest
            ghcr.io/${{ github.repository_owner }}/insurance-claim-api:${{ github.sha }}

      # - name: Trigger Render deploy
